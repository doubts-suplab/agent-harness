site_name: HALO — agent-harness (Python)
site_description: API reference for the Python binding of the HALO harness protocol.
repo_url: https://github.com/doubts-suplab/agent-harness
docs_dir: apidocs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            members_order: source
            separate_signature: true

nav:
  - Home: index.md
  - API reference: api.md
