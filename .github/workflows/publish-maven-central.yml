name: Publish Java binding to Maven Central

# Deploys the Java binding to Maven Central on a GitHub Release (or manual dispatch) via the
# `release` profile in bindings/java/pom.xml (sources + javadoc + GPG signing + central-publishing).
#
# GATED on external setup: requires the `com.agentharness` (or future) namespace verified on the
# Central Portal and these repo secrets — CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD,
# GPG_PRIVATE_KEY, GPG_PASSPHRASE. Until configured this fails closed. autoPublish=false leaves the
# deployment staged for a human to release in the portal. See docs/publishing.md.
#
# (A separate workflow, publish-java.yml, already publishes to GitHub Packages — a different channel.)
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Deploy to Maven Central (staged)
        run: mvn -B -ntp -Prelease deploy -DskipTests
        working-directory: bindings/java
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
