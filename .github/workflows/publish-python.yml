name: Publish Python binding

# Builds the Python binding and publishes it to PyPI on a GitHub Release (or manual dispatch),
# using PyPI Trusted Publishing (OIDC — no API token stored in the repo).
#
# GATED on external setup: this only succeeds once a PyPI project named `agent-harness` exists and a
# Trusted Publisher is configured for it pointing at this workflow. Until then the publish step fails
# closed; the build step still validates that the package is publishable. See docs/publishing.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
        working-directory: bindings/python
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist
